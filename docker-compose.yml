services:
  # Static frontend on nginx. Also reverse-proxies /api to the sync service.
  web:
    # Pull the published image by default so `docker compose pull && up -d`
    # updates without rebuilding. `build:` stays as a fallback — use
    # `docker compose up -d --build` to build from source instead. Override the
    # image (e.g. to your own fork's registry) with OPENLOO_WEB_IMAGE in .env.
    image: ${OPENLOO_WEB_IMAGE:-ghcr.io/baconwappedbitcoin/openloo-web:latest}
    build: .
    container_name: openloo-web
    labels:
      # Let Watchtower auto-update this container when a new image is published.
      - com.centurylinklabs.watchtower.enable=true
    ports:
      # host:container. nginx listens on 8080 inside the container; we publish
      # it on 8086 because 8080 is a common port to already have taken. Change
      # the left number to serve OpenLoo on a different host port.
      - '8086:8080'
    restart: unless-stopped
    depends_on:
      - api
    read_only: true
    # nginx writes its pid and temp files to /tmp (see docker/nginx.conf), so
    # that single tmpfs is all a read-only container needs. mode 01777 lets the
    # non-root worker create files in a freshly mounted, root-owned tmpfs.
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Sync API. Holds one passcode-guarded document on a persistent volume. Not
  # published to the host — only the web service reaches it, over the internal
  # compose network.
  api:
    image: ${OPENLOO_API_IMAGE:-ghcr.io/baconwappedbitcoin/openloo-api:latest}
    build: ./server
    container_name: openloo-api
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # Optional. Set a passcode here to configure it up front, or leave it
      # blank and create one through the first-run screen in the browser. Until
      # a passcode exists (either way) the sync store refuses all data access.
      OPENLOO_PASSCODE: ${OPENLOO_PASSCODE:-}
      DATA_DIR: /data
    volumes:
      - openloo-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  # Your boards and session tokens live here, surviving container rebuilds.
  openloo-data:
