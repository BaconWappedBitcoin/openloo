# Full nginx configuration for OpenLoo's static bundle. This replaces the
# image's default /etc/nginx/nginx.conf rather than dropping a file into
# conf.d, so that the pid file and every scratch path can be pointed at /tmp.
#
# Why that matters: the container runs with a read-only root filesystem and as
# a non-root user. A tmpfs mounted over a directory arrives fresh and
# root-owned, wiping any ownership set at build time, so the only reliably
# writable place at runtime is a single tmpfs we control. Sending pid and all
# temp paths there means /tmp is the one and only mount nginx needs to write.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Every path nginx might write to, redirected onto the writable tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Caching is expressed with `expires` rather than `add_header` on
        # purpose: an `add_header` inside a location resets header inheritance,
        # which would strip the security headers below from asset and document
        # responses. `expires` sets Cache-Control without touching that chain,
        # so the security headers apply to every response.

        # Hashed asset filenames are immutable; cache them hard.
        location /assets/ {
            expires 1y;
        }

        # The entry document must never be cached, or an upgrade would keep
        # serving an old bundle.
        location = /index.html {
            expires -1;
        }

        # SPA fallback: unknown paths serve the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # OpenLoo is a self-contained bundle. The only outbound requests it can
        # make are favicon lookups, and only when the user opts into a provider
        # — hence img-src allowing https while everything else stays same-origin.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    }
}
